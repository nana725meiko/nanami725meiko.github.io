<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini CD Charm 試作デモ</title>
<meta name="theme-color" content="#E9F0F5">
<style>
:root{
  --bg:#E9F0F5; --ink:#12263A; --muted:#4A5F73; --line:#BFD0DD;
  --accent:#1B8FCB; --wood:#C98445; --wood-dark:#6E3E1C; --card:#F7FAFC;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
  padding:max(16px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
}
main{max-width:420px; margin:0 auto}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:3px}

.top{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px}
.top b{font-size:15px}
.chip{font-size:12px; padding:2px 10px; border:1.5px solid var(--muted); border-radius:999px; color:var(--muted)}

/* ディスク:タップで再生/一時停止 */
.disc-wrap{display:grid; place-items:center; margin:6px 0 20px}
.disc{
  position:relative; width:min(72vw,280px); aspect-ratio:1; border-radius:50%; border:0; padding:0;
  background:conic-gradient(from 20deg,#c8e8f7,#f2d3ee,#cdeed4,#fbe9c6,#c4dcf8,#d9c9f3,#c8e8f7);
  box-shadow:0 18px 30px -12px rgba(18,38,58,.45), inset 0 0 0 2px rgba(255,255,255,.55);
  transition:transform .2s;
}
.disc:active{transform:scale(.97)}
.disc::before{ /* 反射のにじみ */
  content:""; position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 200deg,rgba(255,255,255,.55),rgba(255,255,255,0) 20%,rgba(255,255,255,.35) 50%,rgba(255,255,255,0) 70%,rgba(255,255,255,.55));
}
.label{
  position:absolute; inset:29%; border-radius:50%;
  background:repeating-radial-gradient(circle,#d4934f 0 3px,#b9763a 3px 6px);
  box-shadow:0 0 0 2px var(--wood-dark);
  display:grid; place-items:end center; padding-bottom:12%;
  color:var(--wood-dark); font-weight:800; letter-spacing:.12em; font-size:15px;
}
.hole{position:absolute; inset:46%; border-radius:50%; background:var(--bg); box-shadow:inset 0 0 0 2px rgba(18,38,58,.25)}
.disc.playing{animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{text-align:center; font-size:14px; color:var(--muted); margin:-8px 0 14px; min-height:1.6em}

/* 曲名 */
.now h1{font-size:26px; line-height:1.25; margin:0; font-weight:800}
.now p{margin:2px 0 0; color:var(--muted); font-size:15px}

/* シークバー */
.seek{margin:16px 0 4px}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:28px; background:transparent; margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:6px; border-radius:3px; background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:6px; border-radius:3px; background:var(--line)}
input[type=range]::-moz-range-progress{height:6px; border-radius:3px; background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--ink); border:3px solid var(--bg); margin-top:-7px}
input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:var(--ink); border:3px solid var(--bg)}
.times{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}

/* 操作ボタン */
.ctrl{display:flex; justify-content:center; align-items:center; gap:22px; margin:10px 0 22px}
.ctrl button{border:0; background:none; width:52px; height:52px; border-radius:50%; display:grid; place-items:center}
.ctrl button svg{width:26px; height:26px; fill:var(--ink)}
.ctrl .main{width:68px; height:68px; background:var(--ink)}
.ctrl .main svg{width:30px; height:30px; fill:#fff}

/* 曲一覧 */
.list{list-style:none; margin:0; padding:0; border-top:1.5px solid var(--line)}
.list button{
  width:100%; text-align:left; background:none; border:0; border-bottom:1.5px solid var(--line);
  padding:12px 4px; display:flex; justify-content:space-between; gap:12px; align-items:center; min-height:48px;
}
.list .t{font-weight:700}
.list .d{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.list li.on button{background:var(--card)}
.list li.on .t{color:var(--accent)}
.list li.on .t::before{content:"再生中 "; font-size:12px; font-weight:700; color:var(--accent)}

.msg{margin:12px 0 0; padding:10px 12px; border-radius:8px; background:#FFF1E0; color:#6A3A0E; font-size:14px}
.msg[hidden]{display:none}
.notes{margin-top:24px; font-size:13px; color:var(--muted)}
.notes p{margin:4px 0}

@media (prefers-reduced-motion:reduce){ .disc.playing{animation:none} .disc{transition:none} }
</style>
</head>
<body>
<main>
  <div class="top"><b>Mini CD Charm</b><span class="chip">試作デモ</span></div>

  <div class="disc-wrap">
    <button class="disc" id="disc" type="button" aria-label="再生・一時停止">
      <span class="label">NFC</span><span class="hole"></span>
    </button>
  </div>
  <p class="hint" id="hint">ディスクをタップすると再生します</p>

  <section class="now" aria-live="polite">
    <h1 id="title">-</h1>
    <p id="artist">-</p>
  </section>

  <div class="seek">
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>

  <div class="ctrl">
    <button type="button" id="prev" aria-label="前の曲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
    <button type="button" id="play" class="main" aria-label="再生"><svg viewBox="0 0 24 24" aria-hidden="true" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button type="button" id="next" aria-label="次の曲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg></button>
  </div>

  <ol class="list" id="list"></ol>
  <p class="msg" id="msg" role="alert" hidden></p>

  <div class="notes">
    <!-- ▼ クレジット表記(音源を差し替えたら、ここも書き換えてください) -->
    <p>音源:このデモ用に作成した曲です(自由に差し替えできます)。</p>
    <!-- ▲ -->
    <p>この画面は試作です。音量は、スマホ本体の音量ボタンで調整してください。</p>
  </div>
</main>

<script>
/* ▼ 曲の設定:ここを書き換えると、曲名やファイルを変えられます */
const ALBUM = { artist: "Demo Artist", cover: "cover.jpg" };
const TRACKS = [
  { title: "Morning Chime", file: "audio/track1.mp3" },
  { title: "Wooden Pulse",  file: "audio/track2.mp3" }
];
/* ▲ ここまで */

const $ = id => document.getElementById(id);
const audio = new Audio();
audio.preload = "metadata";
let idx = 0, seeking = false;
const durations = {};

const fmt = s => { if (!isFinite(s)) return "0:00"; s = Math.floor(s); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const showMsg = t => { const m = $("msg"); m.textContent = t || ""; m.hidden = !t; };

function renderList(){
  const ol = $("list"); ol.innerHTML = "";
  TRACKS.forEach((t,i) => {
    const li = document.createElement("li");
    if (i === idx) li.className = "on";
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="t"></span><span class="d"></span>';
    b.querySelector(".t").textContent = t.title;
    b.querySelector(".d").textContent = durations[i] ? fmt(durations[i]) : "";
    b.addEventListener("click", () => { load(i); play(); });
    li.appendChild(b); ol.appendChild(li);
  });
}

function setMediaSession(){
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: TRACKS[idx].title, artist: ALBUM.artist, album: "Mini CD Charm",
    artwork: [{ src: ALBUM.cover, sizes: "900x900", type: "image/jpeg" }]
  });
  navigator.mediaSession.setActionHandler("play", play);
  navigator.mediaSession.setActionHandler("pause", pause);
  navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
  navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
}

function load(i){
  idx = (i + TRACKS.length) % TRACKS.length;
  audio.src = TRACKS[idx].file;
  $("title").textContent = TRACKS[idx].title;
  $("artist").textContent = ALBUM.artist;
  $("seek").value = 0; $("seek").style.setProperty("--p","0%");
  $("cur").textContent = "0:00"; $("dur").textContent = durations[idx] ? fmt(durations[idx]) : "0:00";
  showMsg("");
  renderList(); setMediaSession();
}
function play(){ audio.play().catch(() => showMsg("再生できませんでした。画面をもう一度タップしてください。")); }
function pause(){ audio.pause(); }
function step(d){ const was = !audio.paused; load(idx + d); if (was) play(); }
function toggle(){ audio.paused ? play() : pause(); }

function syncUI(){
  const playing = !audio.paused;
  $("disc").classList.toggle("playing", playing);
  $("play").setAttribute("aria-label", playing ? "一時停止" : "再生");
  $("playIcon").innerHTML = playing ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $("hint").textContent = playing ? "ディスクをタップすると一時停止します" : "ディスクをタップすると再生します";
}

audio.addEventListener("play", syncUI);
audio.addEventListener("pause", syncUI);
audio.addEventListener("loadedmetadata", () => {
  durations[idx] = audio.duration; $("dur").textContent = fmt(audio.duration); renderList();
});
audio.addEventListener("timeupdate", () => {
  if (seeking || !audio.duration) return;
  const p = audio.currentTime / audio.duration * 100;
  $("seek").value = p; $("seek").style.setProperty("--p", p + "%");
  $("cur").textContent = fmt(audio.currentTime);
});
audio.addEventListener("ended", () => { if (idx < TRACKS.length - 1) { load(idx + 1); play(); } else { load(0); syncUI(); } });
audio.addEventListener("error", () => showMsg("音源を読み込めませんでした。ファイル名と置き場所(audioフォルダ)を確認してください。"));

$("seek").addEventListener("input", e => {
  seeking = true;
  const p = e.target.value; e.target.style.setProperty("--p", p + "%");
  if (audio.duration) $("cur").textContent = fmt(p / 100 * audio.duration);
});
$("seek").addEventListener("change", e => {
  if (audio.duration) audio.currentTime = e.target.value / 100 * audio.duration;
  seeking = false;
});
$("disc").addEventListener("click", toggle);
$("play").addEventListener("click", toggle);
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));

load(0); syncUI();
</script>
</body>
</html>
